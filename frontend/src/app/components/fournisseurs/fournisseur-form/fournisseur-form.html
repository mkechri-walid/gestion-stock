<div class="page-container">
  <header class="page-header">
    <h1>{{ isEditMode ? '✏️ Modifier le Fournisseur' : '➕ Nouveau Fournisseur' }}</h1>
  </header>

  <nav class="breadcrumb">
    <a routerLink="/dashboard">Dashboard</a> / 
    <a routerLink="/fournisseurs">Fournisseurs</a> / 
    <span>{{ isEditMode ? 'Modifier' : 'Nouveau' }}</span>
  </nav>

  <div class="form-container">
    <form (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label for="nom">Nom du Fournisseur *</label>
          <input 
            type="text" 
            id="nom" 
            [(ngModel)]="fournisseur.nom" 
            name="nom"
            required
            placeholder="Ex: TechSupply"
          />
        </div>

        <div class="form-group">
          <label for="email">Email *</label>
          <input 
            type="email" 
            id="email" 
            [(ngModel)]="fournisseur.email" 
            name="email"
            required
            placeholder="contact@fournisseur.com"
          />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="telephone">Téléphone</label>
          <input 
            type="tel" 
            id="telephone" 
            [(ngModel)]="fournisseur.telephone" 
            name="telephone"
            placeholder="+216 XX XXX XXX"
          />
        </div>

        <div class="form-group">
          <label for="pays">Pays</label>
          <input 
            type="text" 
            id="pays" 
            [(ngModel)]="fournisseur.pays" 
            name="pays"
            placeholder="Ex: Tunisie"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="adresse">Adresse</label>
        <textarea 
          id="adresse" 
          [(ngModel)]="fournisseur.adresse" 
          name="adresse"
          rows="3"
          placeholder="Adresse complète du fournisseur..."
        ></textarea>
      </div>

      <div class="form-actions">
        <button type="button" routerLink="/fournisseurs" class="btn-secondary">
          ❌ Annuler
        </button>
        <button type="submit" class="btn-primary" [disabled]="loading">
          {{ loading ? '⏳ Enregistrement...' : (isEditMode ? '💾 Modifier' : '➕ Créer') }}
        </button>
      </div>
    </form>
  </div>
</div>

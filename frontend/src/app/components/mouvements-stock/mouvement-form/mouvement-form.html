<div class="page-container">
  <header class="page-header">
    <h1>➕ Nouveau Mouvement de Stock</h1>
  </header>

  <nav class="breadcrumb">
    <a routerLink="/dashboard">Dashboard</a> / 
    <a routerLink="/mouvements">Mouvements</a> / 
    <span>Nouveau</span>
  </nav>

  <div class="form-container">
    <form (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label for="type">Type de Mouvement *</label>
          <select 
            id="type" 
            [(ngModel)]="mouvement.type" 
            name="type"
            (change)="onTypeChange()"
            required
          >
            <option value="entree">📥 Entrée de Stock</option>
            <option value="sortie">📤 Sortie de Stock</option>
          </select>
        </div>

        <div class="form-group">
          <label for="produit">Produit *</label>
          <select 
            id="produit" 
            [(ngModel)]="mouvement.produit_id" 
            name="produit"
            required
          >
            <option value="">-- Sélectionner un produit --</option>
            <option *ngFor="let prod of produits" [value]="prod.id">
              {{ prod.nom }} ({{ prod.reference }}) - Stock: {{ prod.quantite_stock }}
            </option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="quantite">Quantité *</label>
          <input 
            type="number" 
            id="quantite" 
            [(ngModel)]="mouvement.quantite" 
            name="quantite"
            min="1"
            required
            placeholder="Ex: 10"
          />
        </div>

        <div class="form-group">
          <label for="motif">Motif *</label>
          <select 
            id="motif" 
            [(ngModel)]="mouvement.motif" 
            name="motif"
            required
          >
            <option *ngFor="let motif of motifsDisponibles" [value]="motif">
              {{ motif | titlecase }}
            </option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="commentaire">Commentaire</label>
        <textarea 
          id="commentaire" 
          [(ngModel)]="mouvement.commentaire" 
          name="commentaire"
          rows="3"
          placeholder="Informations complémentaires..."
        ></textarea>
      </div>

      <div class="form-actions">
        <button type="button" routerLink="/mouvements" class="btn-secondary">
          ❌ Annuler
        </button>
        <button type="submit" class="btn-primary" [disabled]="loading">
          {{ loading ? '⏳

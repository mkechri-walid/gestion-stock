<div class="page-container">
  <header class="page-header">
    <h1>{{ isEditMode ? '✏️ Modifier la Catégorie' : '➕ Nouvelle Catégorie' }}</h1>
  </header>

  <nav class="breadcrumb">
    <a routerLink="/dashboard">Dashboard</a> / 
    <a routerLink="/categories">Catégories</a> / 
    <span>{{ isEditMode ? 'Modifier' : 'Nouvelle' }}</span>
  </nav>

  <div class="form-container">
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="nom">Nom de la Catégorie *</label>
        <input 
          type="text" 
          id="nom" 
          [(ngModel)]="categorie.nom" 
          name="nom"
          required
          placeholder="Ex: Électronique, Informatique..."
        />
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea 
          id="description" 
          [(ngModel)]="categorie.description" 
          name="description"
          rows="4"
          placeholder="Description de la catégorie..."
        ></textarea>
      </div>

      <div class="form-actions">
        <button type="button" routerLink="/categories" class="btn-secondary">
          ❌ Annuler
        </button>
        <button type="submit" class="btn-primary" [disabled]="loading">
          {{ loading ? '⏳ Enregistrement...' : (isEditMode ? '💾 Modifier' : '➕ Créer') }}
        </button>
      </div>
    </form>
  </div>
</div>

<div class="page-container">
  <header class="page-header">
    <h1>➕ Nouvelle Commande</h1>
  </header>

  <nav class="breadcrumb">
    <a routerLink="/dashboard">Dashboard</a> / 
    <a routerLink="/commandes">Commandes</a> / 
    <span>Nouvelle</span>
  </nav>

  <div class="form-container">
    <form (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label for="fournisseur">Fournisseur *</label>
          <select 
            id="fournisseur" 
            [(ngModel)]="fournisseurId" 
            name="fournisseur"
            required
          >
            <option value="">-- Sélectionner un fournisseur --</option>
            <option *ngFor="let fourn of fournisseurs" [value]="fourn.id">
              {{ fourn.nom }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label for="date_livraison">Date de Livraison Prévue</label>
          <input 
            type="date" 
            id="date_livraison" 
            [(ngModel)]="dateLivraisonPrevue" 
            name="date_livraison"
          />
        </div>
      </div>

      <div class="produits-section">
        <div class="section-header">
          <h3>📦 Produits</h3>
          <button type="button" (click)="ajouterLigne()" class="btn-add-line">
            ➕ Ajouter un produit
          </button>
        </div>

        <div class="lignes-container">
          <div *ngFor="let ligne of lignes; let i = index" class="ligne-commande">
            <div class="ligne-number">{{ i + 1 }}</div>
            
            <div class="ligne-content">
              <select [(ngModel)]="ligne.produit_id" [name]="'produit_' + i" required>
                <option value="">-- Sélectionner un produit --</option>
                <option *ngFor="let prod of produits" [value]="prod.id">
                  {{ prod.nom }} ({{ prod.reference }}) - {{ prod.prix_unitaire }} DT
                </option>
              </select>

              <input 
                type="number" 
                [(ngModel)]="ligne.quantite" 
                [name]="'quantite_' + i"
                min="1"
                placeholder="Qté"
                required
              />

              <button 
                type="button" 
                (click)="supprimerLigne(i)" 
                class="btn-remove"
                [disabled]="lignes.length === 1"
              >
                🗑️
              </button>
            </div>
          </div>

          <div *ngIf="lignes.length === 0" class="empty-lines">
            Aucun produit ajouté. Cliquez sur "Ajouter un produit".
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" routerLink="/commandes" class="btn-secondary">
          ❌ Annuler
        </button>
        <button type="submit" class="btn-primary" [disabled]="loading">
          {{ loading ? '⏳ Création...' : '➕ Créer la Commande' }}
        </button>
      </div>
    </form>
  </div>
</div>

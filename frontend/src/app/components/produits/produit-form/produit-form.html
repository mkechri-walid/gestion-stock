<div class="page-container">
  <header class="page-header">
    <h1>{{ isEditMode ? '✏️ Modifier le Produit' : '➕ Nouveau Produit' }}</h1>
  </header>

  <nav class="breadcrumb">
    <a routerLink="/dashboard">Dashboard</a> / 
    <a routerLink="/produits">Produits</a> / 
    <span>{{ isEditMode ? 'Modifier' : 'Nouveau' }}</span>
  </nav>

  <div class="form-container">
    <form (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label for="nom">Nom du Produit *</label>
          <input 
            type="text" 
            id="nom" 
            [(ngModel)]="produit.nom" 
            name="nom"
            required
            placeholder="Ex: Souris sans fil"
          />
        </div>

        <div class="form-group">
          <label for="reference">Référence *</label>
          <input 
            type="text" 
            id="reference" 
            [(ngModel)]="produit.reference" 
            name="reference"
            required
            placeholder="Ex: REF-0001"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea 
          id="description" 
          [(ngModel)]="produit.description" 
          name="description"
          rows="3"
          placeholder="Description du produit..."
        ></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="prix_unitaire">Prix Unitaire (DT) *</label>
          <input 
            type="number" 
            id="prix_unitaire" 
            [(ngModel)]="produit.prix_unitaire" 
            name="prix_unitaire"
            step="0.01"
            required
            placeholder="0.00"
          />
        </div>

        <div class="form-group">
          <label for="quantite_stock">Quantité en Stock *</label>
          <input 
            type="number" 
            id="quantite_stock" 
            [(ngModel)]="produit.quantite_stock" 
            name="quantite_stock"
            required
            placeholder="0"
          />
        </div>

        <div class="form-group">
          <label for="seuil_alerte">Seuil d'Alerte *</label>
          <input 
            type="number" 
            id="seuil_alerte" 
            [(ngModel)]="produit.seuil_alerte" 
            name="seuil_alerte"
            required
            placeholder="10"
          />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="categorie_id">Catégorie *</label>
          <select 
            id="categorie_id" 
            [(ngModel)]="produit.categorie_id" 
            name="categorie_id"
            required
          >
            <option value="">-- Sélectionner une catégorie --</option>
            <option *ngFor="let cat of categories" [value]="cat.id">
              {{ cat.nom }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label for="fournisseur_id">Fournisseur</label>
          <select 
            id="fournisseur_id" 
            [(ngModel)]="produit.fournisseur_id" 
            name="fournisseur_id"
          >
            <option value="">-- Sélectionner un fournisseur --</option>
            <option *ngFor="let fourn of fournisseurs" [value]="fourn.id">
              {{ fourn.nom }}
            </option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" routerLink="/produits" class="btn-secondary">
          ❌ Annuler
        </button>
        <button type="submit" class="btn-primary" [disabled]="loading">
          {{ loading ? '⏳ Enregistrement...' : (isEditMode ? '💾 Modifier' : '➕ Créer') }}
        </button>
      </div>
    </form>
  </div>
</div>
